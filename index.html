.site-header:after{border-color:#c79b9b}
.logo{color:#66504f}.logo span{color:#c47d98}
.small-btn{background:linear-gradient(173deg,#fff9ed,#efe2d2);box-shadow:1px 2px 0 #d6b9ac;border-color:#b48f8e}
.hero{background:radial-gradient(ellipse at 0 0,#cba66626,transparent 30%),radial-gradient(ellipse at 100% 100%,#c49a591c,transparent 30%),linear-gradient(90deg,#dcc69c20,transparent 3% 97%,#dcc69c20),var(--paper-2);border-color:#c8b298;box-shadow:inset 0 0 26px #9d76390c}
.hero:before{background:linear-gradient(90deg,#f7f0df85 50%,transparent 50%) 0 0/20px 20px,linear-gradient(#f7f0df85 50%,transparent 50%) 0 0/20px 20px,var(--blue);border-color:#95a7b2}
.hero:after{background:linear-gradient(145deg,#f5dfe0,#dec1c7);border-color:#bb969b}
.hero-dots{background:radial-gradient(circle,#cb96a4 0 2.6px,transparent 3.2px) 0 0/22px 22px,#f1e6dc;border-color:#c3a2a0}
.hero-stripes{background:repeating-linear-gradient(90deg,#e4d49c 0 13px,#f6edcc 13px 26px);border-color:#bdad78;box-shadow:inset 0 0 16px #ae8c4c25}
.paper-fold{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(90deg,transparent 49.4%,#a5865320 49.7%,#fffdf276 49.85%,transparent 50.1%),linear-gradient(0deg,transparent 35.6%,#a2824a10 35.85%,#fffdf258 36%,transparent 36.2%);opacity:.7}
.archive-stamp{position:absolute;left:47%;bottom:11%;z-index:4;padding:8px 11px;border:2px double #a7657a66;color:#a7657ab0;font:8px/1.6 'Courier New',monospace;letter-spacing:.12em;transform:rotate(-11deg);text-align:center;pointer-events:none}
.eyebrow span{background:#e9dca8;border-color:#bcae7b;box-shadow:inset 0 0 5px #a4843b15}
.hero h1{color:#655050}.hero h1 em{color:#bf7a8e;text-shadow:1px 1px 0 #fdf5e6,2px 2px 0 #d7c38880}
.hero-love{color:#8da78b}.pill{background:#685358;border-color:#685358;box-shadow:3px 4px 0 #c8a6a9;color:#fff8e9}
.candy-name span{-webkit-text-stroke:.8px #765e60;text-shadow:2px 3px 0 #f9efdc,3px 4px 0 #92716d;box-shadow:1px 3px 4px #75533c1c;border-radius:2px 1px 3px 2px;clip-path:polygon(0 2%,15% 0,38% 1%,61% 0,84% 2%,100% 0,99% 28%,100% 55%,98% 79%,100% 100%,73% 99%,50% 100%,28% 98%,1% 100%,2% 71%,0 44%)}
.candy-name span:nth-child(1){background:radial-gradient(circle,#f7ecda 0 2.7px,transparent 3.3px) 0 0/15px 15px,#d998aa}
.candy-name span:nth-child(2){background:repeating-linear-gradient(90deg,#f8f0df75 0 7px,transparent 7px 14px),#b4cbd7}
.candy-name span:nth-child(3){background:#e8d797;color:#ca8b9a}
.candy-name span:nth-child(4){background:linear-gradient(45deg,#f9efdf70 25%,transparent 25% 75%,#f9efdf70 75%) 0 0/18px 18px,#cbbcd0}
.candy-name span:nth-child(5){background:#bdcfb8}
.gingham-card{border-color:#99abb0;background:linear-gradient(90deg,#fbf4e580 50%,transparent 50%) 0 0/24px 24px,linear-gradient(#fbf4e580 50%,transparent 50%) 0 0/24px 24px,#aec6d4;box-shadow:5px 7px 0 #dbc1c0,7px 10px 12px #765b3310}
.gingham-card:after{content:'';position:absolute;inset:7px;border:1px dashed #fcf5e3a0;pointer-events:none}
.gingham-card span{border-color:#9e8c7c;background:#f6edda;color:#7b675c}
.phone-frame{background:linear-gradient(135deg,#c598a432,transparent 28% 78%,#a67d7728),#ead0cf;border-color:#b49696;box-shadow:5px 7px 0 #d8c88f,7px 10px 10px #81613a14;border-radius:2px 3px 1px 4px}
.phone-frame:before,.phone-frame:after{height:14px;background:radial-gradient(circle at 3px 4px,#d5b7b7 0 1px,transparent 1.3px) 0 0/7px 7px,radial-gradient(circle at 5px 0,transparent 5px,#f8edda 5.5px) 0 0/12px 14px repeat-x}
.hero-phone{border-color:#f5eddf;outline-color:#b09891}
.worn-tape{position:absolute;top:-15px;left:27%;width:98px;height:30px;z-index:7;transform:rotate(-7deg);background:linear-gradient(174deg,transparent 46%,#ad8f5520 48%,#fff4c83d 52%,transparent 56%),repeating-linear-gradient(90deg,#e2ca8f70 0 3px,#ddc38a75 3px 4px);border-inline:1px solid #ac90534d;clip-path:polygon(0 8%,5% 0,9% 9%,17% 2%,28% 5%,45% 0,67% 5%,88% 0,100% 4%,97% 23%,100% 42%,97% 66%,100% 90%,93% 100%,72% 96%,51% 100%,28% 95%,7% 100%,0 94%,3% 73%,0 55%,2% 29%)}

.sticker{background:radial-gradient(ellipse at 80% 90%,#aa87442b,transparent 30%),#e8d99f;border-color:#b69d6d;box-shadow:2px 3px 0 #e8dcc2,3px 5px 6px #77552b16;color:#7c6354;transform:rotate(-9deg)}

.flower-chain{color:#b67c90}.hero-footer{background:#f1e5d9e8;border-color:#c2a69d;color:#8e7368}
.ribbon-label{background:#c6d6bb;border-color:#a1b295;color:#647259}

.project-controls{background:#f7efe2}.project-controls button{background:#eee2d3;border-color:#ccb2a2;color:#80676a}.project-controls button[aria-pressed=true]{background:#e7d7a0;border-color:#c2af78;color:#68564b}

karaoke:{name:'Enjoy Karaoke',year:'2026',type:'MOBILE + MULTI-DEVICE',tag:'让等待，也能成为参与。',intro:'面向团体 KTV 场景，通过可见的队列、演唱准备与候场互动，让等待已久的人更容易加入。',hero:'把等待时间，变成更自然的参与准备。',imgs:['karaoke-home.webp','karaoke-game.webp'],alts:['Enjoy Karaoke 手机首页：队列和演唱准备','Enjoy Karaoke 等待节奏游戏'],role:'手机端信息架构、界面、交互原型与迭代',tools:'Figma / Heuristic Evaluation',prototype:'https://www.figma.com/proto/NoClcx3GF7vxJSn5fkxjqo/Untitled?node-id=254-818&scaling=scale-down&content-scaling=fixed&page-id=206%3A6273&starting-point-node-id=254%3A818',problemTitle:'唱歌的机会，不该只留给最主动的人。',problem:'团体 KTV 中，长时间等待、队列不透明与公开演唱压力，会让部分参与者逐渐退到旁观的位置。设计的切入点，是让他们在等待时持续理解自己的状态，并拥有参与和调整的选择。',opportunity:'如何让团体 KTV 的参与更公平，让等待已久的人也能更自信地加入？',facts:[['3','设备触点：手机、智能屏幕、电视'],['4','手机端设计迭代'],['3','参与者反馈，结合导师意见']],contribution:[['团队范围','共同的项目方向是公平 K 歌与多设备协作。手机是整个服务系统中的个人操作端。'],['独立负责','手机端信息架构、Wireframe、高保真界面与 Figma 交互原型；围绕排队、合唱、准备、候场小游戏与让麦进行四轮迭代。'],['评估与调整','结合 3 位参与者及导师的反馈，依据启发式原则优化导航、状态、视觉层级和弹窗提示。']],process:[['让用户先看到“我的位置”。','早期首页的信息与色彩同时竞争注意力。迭代时，把队列进度卡设为主要视觉焦点，弱化准备卡和其他入口，让用户先理解轮候状态。队列卡集中呈现位置、歌曲与等待信息，下一位列表缩短状态文案。'],['让队列与操作保持一致。','手机处理个人准备与选择，智能屏幕支持公平排队，电视呈现共享演唱与群体反馈。准备页提供 Need More Time 与 Pass the Mic；换位通过请求与确认来表达。'],['把操作结果说清楚。','评估推动了固定导航、反应与游戏反馈，以及准备和让麦提示的调整。用户需要知道操作已经被接收，还是仍在等待其他人的回应。']],decisions:[['我还要等多久？','把队列进度与自己的轮次放在主卡片。用户先判断等待与准备的时机，再决定加入合唱或其他活动。'],['轮到我，但还没准备好。','把暂缓和让位做成明确选择。换位需要请求与确认，让用户知道操作尚在等待对方回应。'],['等待时，我还能怎么加入？','合唱选段、节奏游戏与即时反应，让个人操作与房间活动保持联系。']],reflection:[['已有反馈','参与者认为从查看队列到演唱准备的主流程比较清楚，也认可功能与等待和参与公平问题之间的关联。'],['实际改动','迭代集中在色彩层级、固定导航、游戏与反应反馈，以及准备和让麦提示。时间与视觉约束下，未覆盖全部问题。'],['下一步验证','在真实的多人 KTV 中检查：让麦是否被理解、换位是否公平，以及小游戏是否会分散对现场演唱的关注。']],learning:'状态与选择需要一起设计。让用户看到还要等多久，也要告诉他们在这个阶段可以做什么。视觉层级与反馈帮助这些选择被看见。',limit:'目前是课程设计与原型评估。3 位参与者的反馈不能证明真实群体中的公平性提升，也没有上线后的使用与留存数据。'},
flow:{name:'Flows Matter',year:'2025',type:'EMOTIONAL WELLBEING APP',tag:'让休息与工作的切换，温和一点。',intro:'从周日晚间的焦虑出发，将照片回顾、情绪记录、任务规划与呼吸练习连接为轻量的过渡体验。',hero:'在休息与工作之间，留下一点缓冲。',imgs:['flow-home.webp','flow-diary.webp'],alts:['Flows Matter 休息日首页','Flows Matter 情绪日记'],role:'参与研究、照片回顾与 Checklist 设计、原型及测试分析',tools:'Figma / Think Aloud / SEQ / SUS',prototype:'https://www.figma.com/proto/YQIV8hbraRafsbHx1aE8jr/DECO3200-Prototype?node-id=545-585&scaling=scale-down&content-scaling=fixed&page-id=479%3A107&starting-point-node-id=545%3A585',problemTitle:'问题发生在周一之前。',problem:'团队从“休息到工作”的主题出发，逐步把焦点从提高效率收敛到休息结束前的焦虑与睡眠。用户需要的支持，不应再次变成一项必须完成的工作。',opportunity:'在周日晚间、睡前与工作间隙，提供可以自主进入的轻量支持，降低面对下一周时的心理负担。',facts:[['9 + 3','团队研究：9 次访谈、3 次情境观察'],['4','照片、情绪、待办与呼吸触点'],['10','首轮可用性测试参与者']],contribution:[['研究参与','参与问题定义、二手研究与研究结果归纳；开展半结构访谈，理解休息结束时的感受与行为。'],['共同设计','与组员共同设计照片回顾与 Checklist，参与 Figma 界面和原型制作，探索回顾、规划与放松之间的连接。'],['测试角色','在 10 人可用性测试中担任观察员，记录操作与犹豫，并参与导航、反馈与文案问题的分析。']],process:[['照片回顾：放松流程里的操作负担。','任务是上传休息日照片并添加文字。一些参与者找不到文字输入位置，也不清楚上传区域如何操作；重复教程与倒计时增加了犹豫。改进方向是明确上传入口和输入区域，减少重复引导。'],['待办规划：每一步都要支持过渡。','部分参与者认为待办功能与过渡主题的联系不够直接。设计需要检查用户愿意投入的精力，简化主路径，说明任务规划如何支持休息到工作的转换。'],['情绪日记：功能分类不等于用户目标。','回顾情绪时，一些用户先点击 Record，没有进入 Mood。改进方向是围绕记录与回顾重新检查组织关系，采用更具体的入口文案，再通过任务测试验证。']],decisions:[['按任务理解入口。','用户想找到自己的情绪记录，导航不应要求他们先学会产品分类。情绪记录与回顾可放在同一入口，这是待验证的信息架构方向。'],['让用户知道“已经完成”。','上传或记录后缺少结束反馈，参与者不确定是否成功。需要区分保存成功、未完成与下一步。'],['降低放松流程的操作负担。','减少重复教程，明确照片与文字入口，检查每一步是否直接支持当前任务。更多功能不一定意味着更多支持。']],reflection:[['已有反馈','多数参与者认为情绪日记有助于反思与放松；对照片回顾和待办的看法更分化，需要分别检查场景价值。'],['发现的问题','入口混淆、图形含义与结束提示影响理解。教程不能代替界面自身的说明。'],['下一步验证','用新版任务测试检查入口、表情理解和完成反馈，再考虑更长期的使用研究。现有材料没有记录第二轮测试。']],learning:'观察测试让我更注意用户真正做了什么。点击错误入口或停下来寻找提示，能暴露设计里没有被说清楚的假设。',limit:'这是情绪健康主题的课程原型，现有测试评估使用体验，不能证明缓解焦虑、改善睡眠或其他健康效果，也没有改版后的第二轮对照结果。'}
};

function home(){return `<div class="wrap"><section class="hero"><div class="paper-fold" aria-hidden="true"></div><span class="archive-stamp" aria-hidden="true">JOYCE WU<br>PERSONAL ARCHIVE<br>2025 — 2026</span><div class="hero-dots" aria-hidden="true"></div><div class="hero-stripes" aria-hidden="true"></div><div class="hero-copy"><p class="eyebrow"><span>JOYCE WU</span> / INTERACTION DESIGN</p><h1><span>Thoughtful interfaces,</span><em>playful moments.</em></h1><p>认真理解用户，也给交互留一点玩心。<br>我是吴嘉翊，探索界面、行为与感受之间的连接。</p><a class="pill" href="#work">查看作品 <span>↗</span></a><span class="hero-love" aria-hidden="true">&lt;333*</span></div><div class="hero-art" aria-label="Joyce 的糖果色 Y2K 设计拼贴"><div class="candy-name" aria-hidden="true"><span>J</span><span>O</span><span>Y</span><span>C</span><span>E</span></div><div class="gingham-card" aria-hidden="true"><span>UI / UX</span></div><div class="phone-frame"><span class="worn-tape" aria-hidden="true"></span>${image('karaoke-home.webp','Enjoy Karaoke 手机端首页','class="hero-phone" fetchpriority="high"')}</div><div class="hero-bow" aria-hidden="true">୨୧</div><div class="sticker" aria-hidden="true">made with care<br>&amp; curiosity</div><div class="flower-chain" aria-hidden="true">✿ · ✦ · ✿ · ♡</div></div><div class="hero-footer"><span>SELECTED WORK / 2025—2026</span><span>scroll to peek ↓</span></div></section><section class="work-section reveal" id="work"><div class="section-head"><div><span class="ribbon-label">02 projects</span><h2>Selected work</h2></div><p>研究、判断、原型与测试。<br>点击标签切换，再进入完整案例。</p></div><div class="project-deck"><span class="binder-holes" aria-hidden="true"></span><div class="window-bar"><span>joyce's project scrapbook</span><span class="window-tools" aria-hidden="true">♡ ✦ ୨୧</span></div><div class="project-controls" aria-label="选择展示项目"><button data-project="karaoke" aria-pressed="${selected==='karaoke'}"><span>01</span> Enjoy Karaoke</button><button data-project="flow" aria-pressed="${selected==='flow'}"><span>02</span> Flows Matter</button></div><div class="project-stage" id="project-stage" aria-live="polite">${projectStage(selected)}</div></div></section>${researchArchive()}<section class="about reveal"><div class="about-title"><span class="ribbon-label">about me</span><h2>从真实的问题，<br>到具体的设计。</h2><span class="about-bow" aria-hidden="true">୨୧</span></div><div class="about-copy"><p>我是吴嘉翊，关注移动端界面与交互体验。我通过访谈与观察理解用户任务，用原型让想法可操作，再根据实际反馈检查界面的表达。</p><div class="skills"><span>用户访谈</span><span>情境观察</span><span>信息架构</span><span>UI 设计</span><span>Figma 原型</span><span>可用性测试</span></div></div></section></div>`}
const section=(id,title,body)=>`<section class="case-section reveal" id="${id}"><h2>${title}</h2>${body}</section>`;
function casePage(key){const d=data[key];return `<div class="wrap"><section class="case-hero"><div><a class="back" href="#home">← 返回全部项目</a><h1>${d.name}</h1><h2>${d.hero}</h2><p>${d.intro}</p><a class="pill" href="${d.prototype}" target="_blank" rel="noopener noreferrer">打开 Figma 原型 <span>↗</span></a></div><div class="case-visual">${d.imgs.map((f,i)=>image(f,d.alts[i])).join('')}</div></section><div class="case-info"><div><span>PROJECT</span>${d.year} 课程项目${key==='flow'?' / 5 人团队':' / 多设备服务体验'}</div><div><span>MY ROLE</span>${d.role}</div><div><span>TOOLS & METHODS</span>${d.tools}</div></div><nav class="case-nav" aria-label="项目章节">${[['overview','项目切入'],['research','研究分析'],['role','我的贡献'],['process','设计过程'],['decisions','关键判断'],['screens','界面与互动'],['reflection','验证与反思']].map(([id,t])=>`<a href="#${key}/${id}">${t}</a>`).join('')}</nav>${section('overview',d.problemTitle,`<p class="lead">${d.problem}</p><p class="lead">${d.opportunity}</p><div class="facts">${d.facts.map(([n,t])=>`<div class="fact"><strong>${n}</strong><span>${t}</span></div>`).join('')}</div>`)}${researchSection(key)}${section('role','我的贡献',`<div class="role-grid">${d.contribution.map(([t,p])=>`<article><h3>${t}</h3><p>${p}</p></article>`).join('')}</div>`)}${section('process',key==='karaoke'?'从“功能都在”，到“知道怎么用”。':'设计想表达的，不一定被理解。',`<p class="lead">${key==='karaoke'?'从视觉层级、队列控制到操作反馈，查看每一步的设计目的。':'首轮测试围绕回顾休息日、规划工作周、查看情绪展开。点击查看具体发现。'}</p><div class="evidence">${d.process.map(([t,p],i)=>`<details ${i===0?'open':''}><summary>${t}</summary><p>${p}</p></details>`).join('')}</div>`)}${section('decisions','让设计判断回到用户任务。',`<div class="decision-grid"><article class="decision-feature"><h3 class="big-question">${d.decisions[0][0]}</h3><p>${d.decisions[0][1]}</p></article><div class="decision-aside">${d.decisions.slice(1).map(([t,p])=>`<article><h3>${t}</h3><p>${p}</p></article>`).join('')}</div></div>`)}${section('screens','看界面，也试试交互。',`<p class="lead">保留课程项目的真实界面。点击图片可以放大，下面的简化演示帮助理解交互思路。</p><div class="gallery">${d.imgs.map((f,i)=>`<figure><button data-zoom="${assetPaths[f]}" data-caption="${d.alts[i]}" aria-label="放大查看：${d.alts[i]}">${image(f,d.alts[i],'loading="lazy"')}<span class="zoom-hint">放大 ↗</span></button><figcaption>${d.alts[i]}</figcaption></figure>`).join('')}</div>${key==='karaoke'?karaokeDemo():flowDemo()}`)}${section('reflection','验证到哪里，下一步去哪里。',`<div class="role-grid">${d.reflection.map(([t,p])=>`<article><h3>${t}</h3><p>${p}</p></article>`).join('')}<article><h3>我的收获</h3><p>${d.learning}</p></article></div><p class="note">验证边界：${d.limit}</p><p><a class="small-btn" href="https://joyce-design-studies.rocky-okapi-6530.chatgpt.site/#${key}" target="_blank" rel="noopener noreferrer">查看原案例与研究展板 ↗</a></p>`)}<div class="end-case"><span class="mono">NEXT PROJECT</span><a href="#${key==='karaoke'?'flow':'karaoke'}">${key==='karaoke'?'Flows Matter':'Enjoy Karaoke'} ↗</a></div></div>`}
function karaokeDemo(){return `<div class="playground"><div><h3>不是等着，<br>而是有选择。</h3><p>试着进入准备，再选择暂缓或让麦。换位不会立即发生，需要对方回应。</p><p>也可以玩一段 10 秒的候场节奏互动。</p><p class="note">这是本次作品集新增的说明性演示。人物、歌曲与时间为示例，不是真实房间或原项目的测试结果。</p></div><div class="demo-box"><div class="window-bar"><span>karaoke / try the flow</span><span aria-hidden="true">♫</span></div><div class="demo-body"><div class="demo-title"><strong>YOUR ROOM</strong><button class="small-btn" id="reset-demo">重置</button></div><ol class="queue-list"><li>Daniel <small>正在演唱</small></li><li>Alex <small>准备中</small></li><li class="you">Joyce（你） <small id="your-state">等待中</small></li><li>Sam <small>等待中</small></li></ol><div id="queue-actions"><button class="pill" id="prepare">进入准备 ↗</button></div><div class="feedback" id="queue-feedback" role="status">你排在第 3 位。轮到之前，可以先准备。</div><hr><div class="demo-title"><strong>候场节奏互动</strong><span id="game-time">10 秒</span></div><p class="note">开始后，每隔约半秒点一次。按自己的节奏即可，没有排名。</p><button class="small-btn" id="game-start">开始互动</button><button class="game-pad" id="game-tap" disabled>点击节奏</button><p id="game-result" role="status" class="note">尚未开始。</p></div></div></div>`}
function flowDemo(){return `<div class="playground"><div><h3>给此刻的自己，<br>留一点空间。</h3><p>选择一个心情，写下一句话。保存后会看到明确反馈，也可以尝试一轮短呼吸练习。</p><p class="note">本次新增的交互说明。心情只在本页临时显示，刷新后清除，不上传。呼吸动画用于展示交互，不代表已验证的健康效果。</p></div><div class="demo-box"><div class="window-bar"><span>flows matter / a moment for you</span><span aria-hidden="true">♡</span></div><div class="demo-body"><strong>现在感觉怎么样？</strong><div class="choices" aria-label="选择心情"><button data-mood="平静" aria-pressed="false">平静</button><button data-mood="疲惫" aria-pressed="false">疲惫</button><button data-mood="有点焦虑" aria-pressed="false">有点焦虑</button></div><label for="mood-note">留给自己的一句话（选填）</label><textarea id="mood-note" maxlength="200" placeholder="此刻，我想记住……"></textarea><div class="choices"><button id="save-mood">保存这一刻</button><button id="reset-mood">清除</button></div><div class="feedback" id="mood-feedback" role="status">选择一个心情，再保存这一刻。</div><div class="breath-stage"><div class="breath-orb" id="breath-orb">慢一点</div></div><button class="small-btn" id="breathe">开始 16 秒呼吸</button><span id="breath-status" class="note" role="status"></span></div></div></div>`}
function showReveal(){const els=$$('.reveal');if(!('IntersectionObserver'in window)||reduce.matches)return;const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pending');e.target.classList.add('seen');observer.unobserve(e.target)}}),{threshold:.08});els.forEach(el=>{el.classList.add('pending');observer.observe(el)});const prev=cleanup;cleanup=()=>{observer.disconnect();prev()}}
function renderPage(){const parts=location.hash.slice(1).split('/'),key=parts[0]||'home';if(key==='work'){if(page!=='home'){cleanup();cleanup=()=>{};$('#main').innerHTML=home();page='home';bindHome();bindResearch();setupMotion();showReveal()}$('#work').scrollIntoView();return}const next=data[key]?key:'home';if(page!==next){cleanup();cleanup=()=>{};page=next;$('#main').innerHTML=next==='home'?home():casePage(next);document.title=next==='home'?'Joyce Wu · UI/UX 作品集':data[next].name+' · Joyce Wu';$$('.site-header nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+next?'page':'false'));if(next==='home')bindHome();else {selected=next;bindCase(next);}bindResearch();setupMotion();showReveal();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}if(parts[1])document.getElementById(parts[1])?.scrollIntoView()}
function bindHome(){$$('[data-project]').forEach(b=>b.addEventListener('click',e=>{if(selected===b.dataset.project)return;selected=b.dataset.project;$$('[data-project]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));swapProject($('#project-stage'),()=>projectStage(selected),e.detail>0)}))}
function bindCase(key){$$('[data-zoom]').forEach(b=>b.addEventListener('click',()=>{$('#zoom-image').src=b.dataset.zoom;$('#zoom-image').alt=b.dataset.caption;$('#zoom-caption').textContent=b.dataset.caption;openZoom()}));if(key==='karaoke')bindKaraoke();else bindFlow()}
function bindKaraoke(){let phase='waiting',timer=null,end=0,taps=0,last=0,steady=0;const state=t=>$('#your-state').textContent=t,feedback=t=>$('#queue-feedback').textContent=t;
function actions(){const a=$('#queue-actions');a.innerHTML=phase==='waiting'?'<button class="pill" id="prepare">进入准备 ↗</button>':phase==='prepare'?'<div class="choices"><button id="ready">我准备好了</button><button id="more-time">再给我一点时间</button><button id="pass">Pass the Mic</button></div>':phase==='requested'?'<div class="choices"><button id="accept">模拟对方同意</button><button id="decline">模拟对方拒绝</button><button id="cancel">取消请求</button></div>':'<button class="small-btn" id="return-queue">返回队列</button>';a.querySelector('#prepare')?.addEventListener('click',()=>{phase='prepare';state('准备中');feedback('可以先准备，也可以选择暂缓或让麦。');actions()});a.querySelector('#ready')?.addEventListener('click',()=>{phase='ready';state('准备完成');feedback('准备状态已更新。轮到你时，房间会提示。');actions()});a.querySelector('#more-time')?.addEventListener('click',()=>{phase='waiting';state('需要更多时间');feedback('已标记“需要更多时间”。队列没有自动换位。');actions()});a.querySelector('#pass')?.addEventListener('click',()=>{phase='requested';state('请求待确认');feedback('已向 Sam 发送换位请求，等待对方确认。');actions()});a.querySelector('#accept')?.addEventListener('click',()=>{phase='accepted';state('已换位');feedback('Sam 已同意。你将在 Sam 之后演唱，换位完成。');const list=$('.queue-list');list.insertBefore(list.lastElementChild,list.querySelector('.you'));actions()});a.querySelector('#decline')?.addEventListener('click',()=>{phase='waiting';state('等待中');feedback('Sam 暂时不能换位。原顺序保留，你可以继续准备。');actions()});a.querySelector('#cancel')?.addEventListener('click',()=>{phase='waiting';state('等待中');feedback('换位请求已取消，原顺序保留。');actions()});a.querySelector('#return-queue')?.addEventListener('click',()=>{phase='waiting';actions()})}
actions();$('#reset-demo').onclick=()=>{phase='waiting';state('等待中');feedback('你排在第 3 位。轮到之前，可以先准备。');const l=$('.queue-list'),you=l.querySelector('.you');l.insertBefore(you,[...l.children].find(el=>el.textContent.startsWith('Sam')));actions()};
function stopGame(done){clearInterval(timer);timer=null;$('#game-tap').disabled=true;$('#game-start').disabled=false;$('#game-time').textContent=done?'完成':'10 秒';if(done)$('#game-result').textContent=`完成了 ${taps} 次点击，其中 ${steady} 次接近半秒间隔。随时可以再试。`}
$('#game-start').onclick=()=>{taps=0;steady=0;last=0;end=performance.now()+10000;$('#game-tap').disabled=false;$('#game-start').disabled=true;$('#game-time').textContent='10 秒';$('#game-result').textContent='开始了，跟随自己的节奏。';timer=setInterval(()=>{const seconds=Math.ceil((end-performance.now())/1000);if(seconds<=0)stopGame(true);else $('#game-time').textContent=seconds+' 秒'},100)};$('#game-tap').onclick=()=>{const now=performance.now();if(!timer)return;if(now>=end){stopGame(true);return}if(last&&Math.abs(now-last-500)<150)steady++;last=now;taps++;$('#game-result').textContent=`收到第 ${taps} 次点击。`};cleanup=()=>{clearInterval(timer)}}
function bindFlow(){let mood='',timer=null,step=0;$$('[data-mood]').forEach(b=>b.onclick=()=>{mood=b.dataset.mood;$$('[data-mood]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#mood-feedback').textContent='已选择：'+mood+'。准备好后，保存这一刻。'});$('#save-mood').onclick=()=>{if(!mood){$('#mood-feedback').textContent='请先选择一个心情。';return}const text=$('#mood-note').value.trim();$('#mood-feedback').textContent='已记录在本页：'+mood+(text?'。'+text:'。')};$('#reset-mood').onclick=()=>{mood='';$('#mood-note').value='';$$('[data-mood]').forEach(x=>x.setAttribute('aria-pressed','false'));$('#mood-feedback').textContent='已清除。可以重新选择一个心情。'};
function stop(){clearInterval(timer);timer=null;$('#breath-orb').className='breath-orb';$('#breath-orb').textContent='慢一点';$('#breathe').textContent='开始 16 秒呼吸'}
$('#breathe').onclick=()=>{if(timer){stop();$('#breath-status').textContent=' 已暂停。';return}step=0;$('#breathe').textContent='暂停练习';const update=()=>{if(step===4){stop();$('#breath-status').textContent=' 练习结束，回到自己的节奏。';return}const inhale=step%2===0;$('#breath-orb').className='breath-orb '+(inhale?'inhale':'exhale');$('#breath-orb').textContent=inhale?'吸气':'呼气';$('#breath-status').textContent=inhale?' 缓缓吸气，4 秒。':' 缓缓呼气，4 秒。';step++};update();timer=setInterval(update,4000)};cleanup=()=>clearInterval(timer)}
const sprinkleButton=$('#sprinkle'),sprinkleLayer=$('#sprinkle-layer');
sprinkleButton.onclick=()=>{if(reduce.matches)return;const marks=['✦','♡','୨୧','✿','·'];for(let i=0;i<12;i++){const mark=document.createElement('span');mark.textContent=marks[i%marks.length];mark.style.left=(12+Math.random()*76)+'vw';mark.style.top=(8+Math.random()*65)+'vh';mark.style.color=['#ff78a8','#6ca9e8','#efc94c','#79c9ad','#aa8ce8'][i%5];mark.style.animationDelay=(Math.random()*120)+'ms';sprinkleLayer.append(mark);mark.addEventListener('animationend',()=>mark.remove())}sprinkleButton.animate([{transform:'scale(1)'},{transform:'scale(.92) rotate(-3deg)'},{transform:'scale(1.08) rotate(2deg)'},{transform:'scale(1)'}],{duration:480,easing:'cubic-bezier(.2,1.6,.4,1)'})};
function closeIntro(){clearTimeout(introTimer);const intro=$('#intro');if(intro.hidden)return;intro.classList.add('leaving');$('#site').inert=false;closeTimer=setTimeout(()=>{intro.hidden=true;intro.classList.remove('leaving');if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true});else $('#main').focus({preventScroll:true})},reduce.matches?150:250);try{sessionStorage.setItem('joyce-intro','seen')}catch{}}
function openIntro(){clearTimeout(closeTimer);lastFocus=document.activeElement;$('#intro').hidden=false;$('#intro').classList.remove('leaving');$('#site').inert=true;$('#skip-intro').focus({preventScroll:true});introTimer=setTimeout(closeIntro,reduce.matches?500:2400)}
$('#skip-intro').onclick=closeIntro;$('#replay').onclick=openIntro;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#intro').hidden)closeIntro()});$('#image-dialog').addEventListener('click',e=>{if(e.target===$('#image-dialog'))closeZoom()});initMotion();window.addEventListener('hashchange',render);renderPage();let seen=false;try{seen=sessionStorage.getItem('joyce-intro')==='seen'}catch{}if(!seen&&!(location.hash&&location.hash!=='#home'))openIntro();
</script></body></html>
